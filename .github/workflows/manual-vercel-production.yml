name: Manual Vercel Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type deploy to confirm a production deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vercel-production-manual
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_production == 'deploy' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Rr4p8wcgsRQR37gS4f4Izg5v
          VERCEL_PROJECT_ID: prj_b85RDvrApNzcQHMjEjFClAswUopy

      - name: Build production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Rr4p8wcgsRQR37gS4f4Izg5v
          VERCEL_PROJECT_ID: prj_b85RDvrApNzcQHMjEjFClAswUopy

      - name: Deploy prebuilt artifact to production
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Rr4p8wcgsRQR37gS4f4Izg5v
          VERCEL_PROJECT_ID: prj_b85RDvrApNzcQHMjEjFClAswUopy
